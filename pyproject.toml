[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "crossso"
version = "4.0.0"
description = "Cost-aware cross-scale observation for remote sensing understanding"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "earthengine-api>=1.5",
  "numpy>=1.26",
  "osmium>=4.0",
  "pandas>=2.0",
  "pillow>=10.0",
  "pyyaml>=6.0",
  "shapely>=2.0",
]

[project.optional-dependencies]
eval = [
  "huggingface-hub>=0.25",
  "matplotlib>=3.8",
  "omegaconf>=2.3",
  "pyarrow>=15,<24",
  "safetensors>=0.4",
  "torch>=2.6",
  "torchvision>=0.21",
  "tqdm>=4.66",
  "transformers>=4.57.1,<5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"crossso.data_prep.profiles" = ["*.yaml"]
